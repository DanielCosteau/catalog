- phase: 01
  title: SEO and structure
  description: Карта страниц строится вокруг отраслей, намерений поиска и понятной URL-логики для каталога, карточек и реестра.
- phase: 02
  title: UX and trust
  description: На этом этапе определяется логика поиска, фильтров, CTA, кабинета бренда и сценариев согласия по персональным данным.
- phase: 03
  title: UI and content
  description: Визуальная система собирает крупную типографику, premium-подачу и единый формат карточек брендов вместе с контентным регламентом.
- phase: 04
  title: Compliance and release
  description: Финальный контур связывает модерацию, публикацию, юридические блоки, аналитику, SSL и эксплуатационные требования.
