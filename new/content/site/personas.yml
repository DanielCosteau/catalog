- name: Анна Петрова
  role: Владелица fashion-бренда
  goal: Получить официальный статус и стать заметной для локальных покупателей, медиа и организаторов событий.
  barrier: Боится сложной бюрократии, перегруженной формы и неочевидных правил публикации данных.
  trust: Понятный путь верификации, объяснение закона 63-ЗСО и прозрачная работа с персональными данными.
- name: Иван Смирнов
  role: Покупатель локальных брендов
  goal: Быстро найти настоящие саратовские бренды одежды, дизайна и гастрономии без хаотичного поиска по соцсетям.
  barrier: Не видит разницы между реальным брендом и случайным инстаграм-магазином без подтверждений.
  trust: Отметка участника реестра, хорошая визуальная подача и актуальные контакты.
- name: Екатерина Волкова
  role: Партнёр и инвестор
  goal: Находить команды и бренды для коллабораций, активаций и корпоративных проектов.
  barrier: Разрозненные источники, нет единой структуры и плохо читается уровень зрелости проекта.
  trust: Статус, отраслевые фильтры, фокус на сотрудничество и качественная витрина кейсов.
- name: Дмитрий Михайлов
  role: Модератор / сотрудник ведомства
  goal: Видеть понятную воронку заявок, контролировать соответствие критериям и получать статистику по отраслям.
  barrier: Плохое качество контента и риск публикации некорректных сведений.
  trust: Премодерация, системный workflow, правовой контур и унифицированные карточки брендов.
